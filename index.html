<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love For Noor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-deep: #e75480;
            --pink-soft: #b05a78;
            --pink-bg-1: #ffe0ec;
            --pink-bg-2: #fff5f8;
            --card-shadow: rgba(231, 84, 128, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--pink-bg-1), var(--pink-bg-2));
            margin: 0;
            padding: 50px 20px 100px;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .love-badge {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 40;
            background-color: white;
            color: var(--pink-soft);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            text-align: left;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 6px 18px var(--card-shadow);
            max-width: 200px;
        }

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .hearts span {
            position: absolute;
            bottom: -40px;
            font-size: 22px;
            opacity: 0;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(0) scale(0.8) rotate(0deg);   opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.9; }
            100% { transform: translateY(-110vh) scale(1.1) rotate(40deg); opacity: 0; }
        }
        .hearts span:nth-child(1) { left: 8%;  font-size: 18px; animation-duration: 11s; animation-delay: 0s; }
        .hearts span:nth-child(2) { left: 22%; font-size: 26px; animation-duration: 14s; animation-delay: 2s; }
        .hearts span:nth-child(3) { left: 38%; font-size: 16px; animation-duration: 9s;  animation-delay: 4s; }
        .hearts span:nth-child(4) { left: 52%; font-size: 30px; animation-duration: 16s; animation-delay: 1s; }
        .hearts span:nth-child(5) { left: 66%; font-size: 20px; animation-duration: 12s; animation-delay: 5s; }
        .hearts span:nth-child(6) { left: 80%; font-size: 24px; animation-duration: 13s; animation-delay: 3s; }
        .hearts span:nth-child(7) { left: 92%; font-size: 16px; animation-duration: 10s; animation-delay: 6s; }

        .content {
            position: relative;
            z-index: 1;
        }

        h1.title {
            font-family: 'Pacifico', cursive;
            color: var(--pink-deep);
            font-size: 68px;
            font-weight: 400;
            margin-bottom: 6px;
            text-shadow: 0 4px 12px rgba(231, 84, 128, 0.25);
            animation: dropIn 0.9s ease both;
        }
        @keyframes dropIn {
            0%   { opacity: 0; transform: translateY(-30px) scale(0.92); }
            60%  { transform: translateY(6px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        p.subtitle {
            color: var(--pink-soft);
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 42px;
            animation: fadeIn 1.1s ease 0.3s both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 16px 16px 22px;
            border-radius: 28px;
            box-shadow: 0 10px 30px var(--card-shadow);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            animation: fadeIn 0.9s ease both;
        }
        .card:nth-child(1) { animation-delay: 0.5s; }
        .card:nth-child(2) { animation-delay: 0.7s; }
        .card:nth-child(3) { animation-delay: 0.9s; }

        .card:hover {
            transform: translateY(-10px) rotate(-1.5deg);
            box-shadow: 0 18px 40px var(--card-shadow);
        }

        .card img {
            width: 300px;
            height: 400px;
            object-fit: cover;
            border-radius: 18px;
            display: block;
        }

        .card figcaption {
            color: var(--pink-soft);
            font-size: 16px;
            font-weight: 600;
            margin-top: 14px;
            max-width: 300px;
            line-height: 1.4;
        }

        .reasons-title {
            font-family: 'Pacifico', cursive;
            color: var(--pink-deep);
            font-size: 42px;
            margin-top: 90px;
            margin-bottom: 30px;
        }
        .reasons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .reason-btn {
            font-family: 'Quicksand', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--pink-soft);
            background: #ffffff;
            border: 2px solid var(--pink-deep);
            padding: 26px 30px;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 8px 22px var(--card-shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: 220px;
        }
        .reason-btn:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 14px 30px var(--card-shadow);
        }

        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(231, 84, 128, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
        }
        .popup-overlay.open {
            display: flex;
        }
        .popup-box {
            background: #ffffff;
            color: var(--pink-soft);
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            max-width: 360px;
            padding: 40px 34px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(231, 84, 128, 0.45);
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            0%   { transform: scale(0.4); opacity: 0; }
            70%  { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }
        .popup-box .close-btn {
            margin-top: 22px;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background: var(--pink-deep);
            border: none;
            padding: 10px 24px;
            border-radius: 14px;
            cursor: pointer;
        }

        @keyframes confettiFall {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), 110vh) rotate(var(--r));
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .confetti span {
            position: absolute;
            top: -50px;
            animation: confettiFall ease-in forwards;
        }
    </style>
</head>
<body>
    <div class="love-badge">
        💞 We've known each other for <strong>3 years</strong><br>
        🌷 Together since <strong>25 March 2026</strong><br>
        <span id="daysCount"></span>
    </div>

    <div class="hearts">
        <span>💗</span>
        <span>🌸</span>
        <span>💕</span>
        <span>✨</span>
        <span>💗</span>
        <span>🌷</span>
        <span>💖</span>
    </div>

    <div class="content">
        <h1 class="title">I love Noor 💗</h1>
        <p class="subtitle">Noor is so pretty, beautiful and smart 🌸</p>

        <div class="gallery">
            <figure class="card">
                <img src="noor1.jpg" alt="Noor 1">
                <figcaption>Noor being so funny and silly</figcaption>
            </figure>
            <figure class="card">
                <img src="noor2.png" alt="Noor 2">
                <figcaption>Noor reading and showing her intellect — she's so smart</figcaption>
            </figure>
            <figure class="card">
                <img src="noor3.jpg" alt="Noor 3">
                <figcaption>Noor being so pretty and beautiful</figcaption>
            </figure>
        </div>

        <h2 class="reasons-title">Why I love Noor 💖</h2>
        <div class="reasons">
            <button class="reason-btn" data-reason="You're so emotionally mature and that inspires me 🌸">
                Reason #1<br>Tap me 💕
            </button>
            <button class="reason-btn" data-reason="You're so smart, kind and understanding I learn from you everyday ✨">
                Reason #2<br>Tap me 💕
            </button>
            <button class="reason-btn" data-reason="You make me feel safe, happy and loved just by being you. 🌷">
                Reason #3<br>Tap me 💕
            </button>
        </div>
    </div>

    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <div id="popupText"></div>
            <button class="close-btn" id="closeBtn">Close 💗</button>
        </div>
    </div>

    <div class="confetti" id="confetti"></div>

    <script>
        function burstLotus() {
            const container = document.getElementById('confetti');
            const lotusCount = 50;

            for (let i = 0; i < lotusCount; i++) {
                const petal = document.createElement('span');
                petal.textContent = '🪷';

                petal.style.left = (Math.random() * 100) + 'vw';
                petal.style.fontSize = (16 + Math.random() * 26) + 'px';
                petal.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
                petal.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
                petal.style.animationDuration = (3 + Math.random() * 3) + 's';
                petal.style.animationDelay = (Math.random() * 1.2) + 's';

                container.appendChild(petal);

                petal.addEventListener('animationend', () => petal.remove());
            }
        }

        function showDaysTogether() {
            const startDate = new Date('2026-03-25');
            const today = new Date();
            const diffTime = Math.abs(today - startDate);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('daysCount').textContent =
                "💖 We've been together for " + diffDays + " days!";
        }

        const popup = document.getElementById('popup');
        const popupText = document.getElementById('popupText');

        const buttons = document.querySelectorAll('.reason-btn');
        buttons.forEach(function (button) {
            button.addEventListener('click', function (event) {
                event.stopPropagation();
                popupText.textContent = button.getAttribute('data-reason');
                popup.classList.add('open');
            });
        });

        document.getElementById('closeBtn').addEventListener('click', function (event) {
            event.stopPropagation();
            popup.classList.remove('open');
        });

        popup.addEventListener('click', function (event) {
            if (event.target === popup) {
                popup.classList.remove('open');
            }
        });

        window.addEventListener('load', burstLotus);
        window.addEventListener('load', showDaysTogether);
        document.body.addEventListener('click', burstLotus);
    </script>
</body>
</html>
